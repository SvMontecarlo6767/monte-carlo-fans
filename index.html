<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a1f">
<title>SV Monte Carlo · WIN CHALLENGE</title>
<style>
:root{--g:#0b2a1f;--g2:#123a2b;--gold:#c9a24b;--gold2:#e7cf8a}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,sans-serif;color:#f4f1e6;background:radial-gradient(120% 60% at 50% 0,#164533 0,var(--g) 55%,#06160f 100%) fixed;min-height:100vh;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;overflow-x:hidden}
header{text-align:center;padding:28px 0 16px}
.logo{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 8px 28px rgba(0,0,0,.5)}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--gold);font-weight:700;margin-top:12px}
h1{font-family:Georgia,serif;font-size:30px;letter-spacing:.14em;color:var(--gold2);font-weight:700}
h2{font-family:Georgia,serif;font-size:14px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
#st{font-size:12px;color:#9fb5a9;margin-top:6px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(201,162,75,.35);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card.done{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,162,75,.18),rgba(255,255,255,.04))}
.center{text-align:center}
.pct{font-family:Georgia,serif;font-size:64px;font-weight:700;color:var(--gold2);line-height:1;text-align:center}
.pct small{font-size:28px}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a9822f,var(--gold2));border-radius:6px;transition:width .9s ease}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#b7c8be}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:center}
.row3 b{display:block;font-size:22px;color:#fff}
.row3 span,.lbl{font-size:11px;letter-spacing:.14em;color:#9fb5a9;text-transform:uppercase}
.clk{font:700 34px ui-monospace,Menlo,monospace;text-align:center;color:#fff;margin-top:14px;letter-spacing:.04em}
.clk.warn{color:var(--gold2)}.clk.crit{color:#ff8a7a}
.name{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:10px;letter-spacing:.18em;background:var(--gold);color:#1a1405;padding:3px 8px;border-radius:20px;font-weight:800}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.it:last-child{border:0}
.it time{color:#7f968a;font-size:12px;white-space:nowrap}
.it.gold span{color:var(--gold2);font-weight:700}
.it.pin{background:rgba(201,162,75,.1);border-radius:8px;padding:10px}
.it.new{animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.cnt{font-family:Georgia,serif;font-size:52px;font-weight:700;color:var(--gold2);line-height:1}
.big{width:100%;margin:16px 0 12px;padding:20px;border:0;border-radius:14px;font-size:20px;font-weight:800;letter-spacing:.16em;color:#1a1405;background:linear-gradient(135deg,#b58a2e,var(--gold2),#b58a2e);box-shadow:0 6px 22px rgba(201,162,75,.35)}
.big.pop{animation:pp .35s ease}
@keyframes pp{50%{transform:scale(.96)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pre{padding:15px 8px;border-radius:12px;border:1px solid rgba(201,162,75,.5);background:rgba(0,0,0,.25);color:#f4f1e6;font-size:13px;font-weight:700;letter-spacing:.06em}
.pre:last-child{grid-column:1/-1}
.pre:active,.btn:active,.big:active{opacity:.8}
button{font:inherit;cursor:pointer}
label{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
textarea,input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(201,162,75,.4);background:rgba(0,0,0,.3);color:#fff;font-size:16px;font-family:inherit}
textarea{height:84px;resize:none}
.btn{padding:12px 20px;border:0;border-radius:10px;background:var(--gold);color:#1a1405;font-weight:800;letter-spacing:.12em}
.btn.ghost{width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold2);margin-top:6px}
.btn.s{padding:8px 12px;font-size:12px}
#mc{font-size:12px;color:#7f968a}
#fb{font-size:13px;margin-top:8px;color:var(--gold2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);font-size:12px;color:#7f968a}
.chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,75,.12)}
.hidden{display:none}
footer{text-align:center;margin-top:24px;font-size:12px}
footer a{color:#6f877b}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:70;max-width:90vw}
#toast.on{opacity:1}
.pov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:60;text-align:center;padding:20px}
.pov div{background:var(--g);border:2px solid var(--gold);border-radius:20px;padding:28px;animation:in .5s ease}
.pov b{display:block;font-family:Georgia,serif;font-size:22px;color:var(--gold2);letter-spacing:.1em}
.cf{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.cf i{position:absolute;top:-10px;width:8px;height:12px;animation:fl 2.2s ease-in forwards}
@keyframes fl{to{transform:translateY(105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
</style>
</head>

const GOAL = {cheers:500, msgs:20}, LEVELS = [100,250,500,1000];

const S = {ch:{},en:{},tm:null,cheers:0,msgs:0,act:{},conn:false,user:null,ok:false,enOk:false,lp:{},sk:null,pw:null,pg:null,lastMsg:0};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt = n => (+n||0).toLocaleString("de-DE",{maximumFractionDigits:1});
let db, auth, TS;

function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2800); }

// Gesamtfortschritt = Durchschnitt der Einzelfortschritte, jeweils auf 100 % gedeckelt.
// Unterschiedliche Einheiten (km, Stück …) werden nie addiert.
function calc(){
  const en=Object.entries(S.en).map(([k,e])=>({k,...e})).filter(e=>e&&S.ch[e.challengeId]&&e.amount>0).sort((a,b)=>a.ts-b.ts);
  const tot={},done={};
  en.forEach(e=>{ tot[e.challengeId]=(tot[e.challengeId]||0)+e.amount; if(done[e.challengeId]==null&&tot[e.challengeId]>=S.ch[e.challengeId].target) done[e.challengeId]=e.ts; });
  const list=Object.keys(S.ch).map(id=>{ const c=S.ch[id],t=tot[id]||0; return {id,c,t,pct:Math.min(100,t/c.target*100),win:t>=c.target,done:done[id]}; });
  const avg=list.length?list.reduce((s,x)=>s+x.pct,0)/list.length:0;
  return {list,avg,wins:list.filter(x=>x.win).length,en};
}

function draw(){
  if(!S.ok||!S.enOk) return;
  const R=calc(), open=R.list.length-R.wins;
  $("#top").innerHTML=`<div class="lbl center">Team Progress</div><div class="pct">${fmt(R.avg)}<small>%</small></div><div class="bar"><i style="width:${R.avg}%"></i></div>
  <div class="row3"><div><b>${R.wins}</b><span>abgeschlossen</span></div><div><b>${open}</b><span>offen</span></div></div>
  <div class="clk" id="clk"></div><div class="lbl center" id="clbl"></div>`;
  tick();
  $("#chs").innerHTML=R.list.length?R.list.map(x=>{ const w=S.lp[x.id]??0; return `<div class="card ${x.win?"done":""}"><div class="name"><span>${x.win?"✓ ":""}${esc(x.c.name)}</span>${x.win?'<span class="badge">COMPLETED</span>':""}</div>
  <div class="bar"><i data-id="${x.id}" data-w="${x.pct}" style="width:${w}%"></i></div>
  <div class="row"><span>${fmt(Math.min(x.t,x.c.target))} / ${fmt(x.c.target)} ${esc(x.c.unit)}</span><span>${x.win?"Ziel erreicht":"Noch "+fmt(x.c.target-x.t)+" "+esc(x.c.unit)}</span></div></div>`; }).join(""):'<div class="card"><p class="lbl center">Noch keine Challenges</p></div>';
  requestAnimationFrame(()=>document.querySelectorAll("#chs .bar i").forEach(i=>{ i.style.width=i.dataset.w+"%"; S.lp[i.dataset.id]=+i.dataset.w; }));
  drawFeed(R); drawFan(R); celebrate(R);
  if(S.user && !$("#adm").classList.contains("hidden")) drawAdm();
}

function drawFeed(R){
  const it=[];
  R.en.forEach(e=>{ const c=S.ch[e.challengeId]; it.push({k:e.k,ts:e.ts,h:`<b>+${fmt(e.amount)} ${esc(c.unit)}</b> · ${esc(c.name)}`}); });
  R.list.filter(x=>x.win&&x.done).forEach(x=>it.push({k:"w"+x.id,ts:x.done,g:1,h:`✓ Challenge „${esc(x.c.name)}“ abgeschlossen`}));
  Object.entries(S.act).forEach(([k,a])=>it.push({k,ts:a.ts||0,pin:a.pinned,h:(a.k==="m"?"💬 ":"")+esc(a.t)}));
  it.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts);
  const first=S.sk===null; if(first) S.sk=new Set();
  $("#feed").innerHTML=it.length?it.slice(0,25).map(x=>{ const n=!first&&!S.sk.has(x.k); S.sk.add(x.k);
    return `<div class="it ${x.g?"gold":""} ${x.pin?"pin":""} ${n?"new":""}"><span>${x.pin?"📌 ":""}${x.h}</span><time>${x.ts?new Date(x.ts).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}</time></div>`; }).join(""):'<p class="lbl center">Noch keine Aktivität</p>';
}

function drawFan(R){
  $("#cnt").textContent=S.cheers.toLocaleString("de-DE");
  const reached=S.cheers>=GOAL.cheers&&S.msgs>=GOAL.msgs;
  const b=(v,m)=>`<div class="bar"><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;
  $("#goal").innerHTML=reached
    ?`<div class="center"><div class="badge" style="display:inline-block">✓ FAN SUPPORT ZIEL ERREICHT</div><div style="font-size:34px;margin-top:10px">🍻</div><div class="lbl" style="margin-top:6px">Kiste Bier</div></div>`
    :`<div class="row"><span>${fmt(Math.min(S.cheers,GOAL.cheers))} / ${GOAL.cheers} Anfeuern</span></div>${b(S.cheers,GOAL.cheers)}<div class="row"><span>${fmt(Math.min(S.msgs,GOAL.msgs))} / ${GOAL.msgs} Nachrichten</span></div>${b(S.msgs,GOAL.msgs)}<div class="center" style="margin-top:10px">🍻 <span class="lbl">Kiste Bier</span></div>`;
  const lv=LEVELS.filter(l=>S.cheers>=l).pop();
  const last=R.list.filter(x=>x.done).sort((a,b)=>b.done-a.done)[0];
  $("#stats").innerHTML=[["Gesamtfortschritt",fmt(R.avg)+" %"],["Challenges abgeschlossen / offen",R.wins+" / "+(R.list.length-R.wins)],["Einträge insgesamt",R.en.length],["Fan Unterstützungen",S.cheers.toLocaleString("de-DE")],["Fan Nachrichten",S.msgs],["Support-Stufe",lv?lv+"×":"—"],["Zuletzt abgeschlossen",last?esc(last.c.name):"—"]]
    .map(([a,v])=>`<div class="it"><span>${a}</span><b>${v}</b></div>`).join("")
    +`<div class="chips">${LEVELS.map(l=>`<span class="chip ${S.cheers>=l?"on":""}">${S.cheers>=l?"✓ ":""}${l}×</span>`).join("")}</div>`;
  const reachedNow=reached; if(S.pg===false&&reachedNow) pov("FAN SUPPORT ZIEL ERREICHT","🍻 KISTE BIER 🍻",true); S.pg=reachedNow;
}

function celebrate(R){
  const W=new Set(R.list.filter(x=>x.win).map(x=>x.id));
  if(S.pw){ R.list.filter(x=>x.win&&!S.pw.has(x.id)).forEach(x=>{ toast("✓ "+x.c.name+" abgeschlossen"); confetti(); }); }
  S.pw=W;
}
function pov(a,b,c){ const d=document.createElement("div"); d.className="pov"; d.innerHTML=`<div><b>${a}</b><p style="margin-top:10px;font-size:18px">${b}</p></div>`; d.onclick=()=>d.remove(); document.body.appendChild(d); if(c) confetti(); setTimeout(()=>d.remove(),4500); }
function confetti(){ const c=document.createElement("div"); c.className="cf"; for(let i=0;i<30;i++){ const p=document.createElement("i"); p.style.cssText=`left:${Math.random()*100}%;background:${["#c9a24b","#e7cf8a","#fff","#2f7a58"][i%4]};animation-delay:${Math.random()*.4}s`; c.appendChild(p); } document.body.appendChild(c); setTimeout(()=>c.remove(),3000); }

function tick(){
  const e=$("#clk"); if(!e) return; const t=S.tm;
  if(!t||!t.endsAt){ e.textContent="--:--:--"; $("#clbl").textContent="Timer noch nicht gestartet"; e.className="clk"; return; }
  const r=Math.max(0,t.endsAt-Date.now()), p=n=>String(n).padStart(2,"0");
  e.textContent=`${p(r/36e5|0)}:${p(r%36e5/6e4|0)}:${p(r%6e4/1e3|0)}`;
  e.className="clk"+(r&&r<=6e5?" crit":r&&r<=36e5?" warn":"");
  $("#clbl").textContent=r?"Verbleibende Zeit":"Zeit abgelaufen";
}
setInterval(tick,1000);

// Unsichtbares Limit: max. 50 Anfeuerungen pro Minute pro Gerät (nur clientseitig, siehe Hinweise).
function allow(){ try{ const n=Date.now(); const a=JSON.parse(localStorage.getItem("wcf")||"[]").filter(t=>n-t<6e4); if(a.length>=50) return false; a.push(n); localStorage.setItem("wcf",JSON.stringify(a)); }catch(e){} return true; }
function cheer(label){
  if(!allow()) return;
  if(!S.conn){ toast("Keine Verbindung – nicht gesendet"); return; }
  const inc=()=>db.ref(P.fan+"/cheers").transaction(c=>(c||0)+1);
  (label?db.ref(P.fan+"/actions").push({t:label,k:"p",ts:TS}).then(inc):inc())
    .then(()=>{ const b=$("#cheer"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); })
    .catch(()=>toast("Konnte nicht gespeichert werden"));
}
const fb=t=>{ $("#fb").textContent=t; };
function send(){
  const t=$("#msg").value.trim();
  if(t.length<3){ fb("Bitte etwas mehr schreiben."); return; }
  if(Date.now()-S.lastMsg<10000){ fb("Einen Moment bitte, dann nochmal senden."); return; }
  if(!S.conn){ fb("Keine Verbindung – Nachricht wurde nicht gesendet."); return; }
  S.lastMsg=Date.now(); fb("Wird gesendet …");
  db.ref(P.fan+"/actions").push({t,k:"m",ts:TS}).then(()=>db.ref(P.fan+"/msgCount").transaction(c=>(c||0)+1))
    .then(()=>{ $("#msg").value=""; $("#mc").textContent="0 / 200"; fb("✓ Gesendet – danke!"); })
    .catch(()=>fb("Konnte nicht gespeichert werden. Bitte nochmal versuchen."));
}

// ====== ADMIN (Firebase Authentication + Security Rules) ======
function drawAdm(){
  const a=$("#adm");
  if(!S.user){ a.innerHTML=`<label>Admin-Login</label><input id="em" type="email" placeholder="E-Mail" autocomplete="username"><input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" style="margin-top:8px"><button class="btn" style="margin-top:10px" onclick="login()">ANMELDEN</button><div id="le" style="color:#ff8a7a;font-size:13px;margin-top:8px"></div>`; return; }
  const m=Object.entries(S.act).filter(([k,x])=>x.k==="m").sort((a,b)=>b[1].ts-a[1].ts);
  a.innerHTML=`<label>Admin · ${esc(S.user.email)}</label>`+(m.length?m.map(([k,x])=>`<div class="it"><span>${x.pinned?"📌 ":""}${esc(x.t)}</span><span style="display:flex;gap:6px"><button class="btn s" onclick="pin('${k}',${!x.pinned})">${x.pinned?"Lösen":"Pin"}</button><button class="btn s" style="background:#c1443c;color:#fff" onclick="del('${k}')">✕</button></span></div>`).join(""):'<p class="lbl">Keine Nachrichten</p>')
   +`<button class="btn ghost" onclick="resetFan()">Fan-Zähler zurücksetzen</button><button class="btn ghost" onclick="auth.signOut()">Abmelden</button>`;
}
function login(){ auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value).catch(()=>{ $("#le").textContent="Anmeldung fehlgeschlagen"; }); }
function pin(k,v){ db.ref(P.fan+"/actions/"+k+"/pinned").set(v?true:null).catch(()=>toast("Keine Berechtigung")); }
function del(k){ if(!confirm("Nachricht löschen?")) return; db.ref(P.fan+"/actions/"+k).remove().then(()=>db.ref(P.fan+"/msgCount").transaction(c=>Math.max(0,(c||0)-1))).catch(()=>toast("Keine Berechtigung")); }
function resetFan(){ if(confirm("Anfeuern- und Nachrichten-Zähler auf 0 setzen? (Nachrichten bleiben sichtbar)")) db.ref(P.fan).update({cheers:0,msgCount:0}).catch(()=>toast("Keine Berechtigung")); }

// ====== START ======
PRESETS.forEach(t=>{ const b=document.createElement("button"); b.className="pre"; b.textContent=t; b.onclick=()=>cheer(t); $("#pres").appendChild(b); });
$("#cheer").onclick=()=>cheer();
$("#send").onclick=send;
$("#msg").oninput=e=>{ $("#mc").textContent=e.target.value.length+" / 200"; };
$("#admo").onclick=e=>{ e.preventDefault(); $("#adm").classList.toggle("hidden"); drawAdm(); };
$("#share").onclick=()=>{ const u=location.href.split("#")[0]; if(navigator.share) navigator.share({title:"SV Monte Carlo · WIN CHALLENGE",url:u}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>toast("Link kopiert")); else toast(u); };

if(!window.firebase||FIREBASE_CONFIG.apiKey.startsWith("DEIN")){
  $("#top").innerHTML='<p class="center">Firebase-Daten fehlen (FIREBASE_CONFIG oben in der Datei).</p>'; $("#st").textContent="";
} else {
  firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database(); auth=firebase.auth(); TS=firebase.database.ServerValue.TIMESTAMP;
  const err=()=>{ if(!S.ok) $("#top").innerHTML='<p class="center">Verbindung zur Datenbank nicht möglich. Bitte Seite neu laden.</p>'; };
  db.ref(P.ch).on("value",s=>{ S.ch=s.val()||{}; S.ok=true; draw(); },err);
  db.ref(P.en).on("value",s=>{ S.en=s.val()||{}; S.enOk=true; draw(); },err);
  db.ref(P.tm).on("value",s=>{ S.tm=s.val(); tick(); },()=>{});
  db.ref(P.fan+"/cheers").on("value",s=>{ S.cheers=+s.val()||0; draw(); },()=>{});
  db.ref(P.fan+"/msgCount").on("value",s=>{ S.msgs=+s.val()||0; draw(); },()=>{});
  db.ref(P.fan+"/actions").limitToLast(60).on("value",s=>{ S.act=s.val()||{}; draw(); },()=>{});
  db.ref(".info/connected").on("value",s=>{ S.conn=!!s.val(); $("#st").textContent=S.conn?"● live verbunden":"○ Verbindung unterbrochen – Daten aktualisieren sich wieder, sobald du online bist"; });
  auth.onAuthStateChanged(u=>{ S.user=u; if(!$("#adm").classList.contains("hidden")) drawAdm(); });
}
</script>
</body>
</html>
